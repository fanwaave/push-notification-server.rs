name: Provider canaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-canaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sendgrid-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENDGRID_CANARY_API_KEY: ${{ secrets.SENDGRID_CANARY_API_KEY }}
      SENDGRID_CANARY_FROM_EMAIL: ${{ secrets.SENDGRID_CANARY_FROM_EMAIL }}
      SENDGRID_CANARY_TO_EMAIL: ${{ secrets.SENDGRID_CANARY_TO_EMAIL }}
      SENDGRID_CANARY_REGION: ${{ vars.SENDGRID_CANARY_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Require the complete SendGrid canary bundle
        shell: bash
        run: |
          missing=()
          [[ -n "$SENDGRID_CANARY_API_KEY" ]] || missing+=(SENDGRID_CANARY_API_KEY)
          [[ -n "$SENDGRID_CANARY_FROM_EMAIL" ]] || missing+=(SENDGRID_CANARY_FROM_EMAIL)
          [[ -n "$SENDGRID_CANARY_TO_EMAIL" ]] || missing+=(SENDGRID_CANARY_TO_EMAIL)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Provider canary cannot run; missing managed secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Authenticate scope and run SendGrid sandbox canary
        shell: bash
        run: |
          cargo test --locked --test provider_canaries \
            sendgrid_sandbox_accepts_the_canonical_email_contract \
            -- --ignored --exact --nocapture

  twilio-test-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWILIO_TEST_ACCOUNT_SID: ${{ secrets.TWILIO_TEST_ACCOUNT_SID }}
      TWILIO_TEST_AUTH_TOKEN: ${{ secrets.TWILIO_TEST_AUTH_TOKEN }}
      TWILIO_TEST_TO_NUMBER: ${{ secrets.TWILIO_TEST_TO_NUMBER }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Require the complete Twilio test-credential bundle
        shell: bash
        run: |
          missing=()
          [[ -n "$TWILIO_TEST_ACCOUNT_SID" ]] || missing+=(TWILIO_TEST_ACCOUNT_SID)
          [[ -n "$TWILIO_TEST_AUTH_TOKEN" ]] || missing+=(TWILIO_TEST_AUTH_TOKEN)
          [[ -n "$TWILIO_TEST_TO_NUMBER" ]] || missing+=(TWILIO_TEST_TO_NUMBER)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Provider canary cannot run; missing managed secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Run Twilio test-credential canary
        shell: bash
        run: |
          cargo test --locked --test provider_canaries \
            twilio_test_credentials_accept_the_canonical_sms_contract \
            -- --ignored --exact --nocapture
