name: One-shot security lock refresh

on:
  push:
    branches:
      - fix/ci-env-policy-baseline
    paths:
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-security-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'fanwaave/push-notification-server.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Resolve patched transitive releases
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p h2 --precise 0.4.19
          cargo update -p chacha20 --precise 0.10.2
          cargo check --locked --all-targets
          git diff --check

      - name: Commit the resolver-owned lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already contains the requested patched releases'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-2636): refresh patched Rust transitive dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
