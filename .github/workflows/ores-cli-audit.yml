name: ores-cli package and env audit

on:
  pull_request:
    paths:
      - ".cli-flags.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/ores-cli-audit.yml"
  push:
    branches: [main]
    paths:
      - ".cli-flags.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/ores-cli-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Fetch immutable ores-cli auditor
        shell: bash
        env:
          ORES_CLI_REV: e488618973f8400a8fc8b6f98ecc870c7ba12e39
        run: |
          set -euo pipefail
          git init /tmp/ores-cli
          git -C /tmp/ores-cli remote add origin https://github.com/ORESoftware/ores-cli.git
          git -C /tmp/ores-cli fetch --depth 1 origin "$ORES_CLI_REV"
          git -C /tmp/ores-cli checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ores-cli rev-parse HEAD)" = "$ORES_CLI_REV"
      - name: Audit package and flags/environment contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ores-cli
          cargo run --locked --bin ores-cli -- --no-json audit package --path "$GITHUB_WORKSPACE"
