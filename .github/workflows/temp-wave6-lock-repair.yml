name: Temporary Wave 6 lock repair
on:
  push:
    branches:
      - formal/multi-method-wave6-20260925
    paths:
      - Cargo.toml
      - .github/workflows/temp-wave6-lock-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: formal/multi-method-wave6-20260925
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Resolve patched dependency graph
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          cargo check --all-features
          grep -A3 '^name = "rustls"$' Cargo.lock | grep 'version = "0.23.45"'
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('Cargo.lock').read_text()
          manifest = Path('Cargo.toml').read_text()
          assert 'jsonwebtoken = { version = "11", features = ["rust_crypto"] }' in manifest
          assert 'name = "rustls"\nversion = "0.23.45"' in lock
          assert 'name = "rustls-webpki"\nversion = "0.103.13"' not in lock
          PY
      - name: Commit lockfile-only resolver output
        run: |
          set -euo pipefail
          extra="$(git status --porcelain | grep -v '^ M Cargo.lock$' || true)"
          test -z "$extra"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: resolve Wave 6 crypto dependency graph'
          git push origin HEAD:formal/multi-method-wave6-20260925
