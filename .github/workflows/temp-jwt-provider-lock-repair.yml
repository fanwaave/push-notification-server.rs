name: Temporary JWT provider lock repair
on:
  push:
    branches:
      - formal/multi-method-wave6-20260925
    paths:
      - Cargo.toml
      - .github/workflows/temp-jwt-provider-lock-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: formal/multi-method-wave6-20260925
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Resolve provider graph and compile it
        run: |
          set -euo pipefail
          cargo check --all-features
          grep -A3 '^name = "rustls"$' Cargo.lock | grep 'version = "0.23.45"'
          if cargo tree -i rsa >/tmp/rsa-tree 2>&1; then
            cat /tmp/rsa-tree
            echo 'rsa remains reachable after selecting aws_lc_rs' >&2
            exit 1
          fi
          grep -q '^name = "aws-lc-rs"$' Cargo.lock
      - name: Commit lockfile-only resolver output
        run: |
          set -euo pipefail
          extra="$(git status --porcelain | grep -v '^ M Cargo.lock$' || true)"
          test -z "$extra"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: resolve AWS-LC JWT provider graph'
          git push origin HEAD:formal/multi-method-wave6-20260925
