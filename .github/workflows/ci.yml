name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate immutable image publication workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/container-image.yml
      - name: Reject source-publication workflows in the destination repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/copy-to-fanwaave.yml
          test ! -e .github/workflows/bootstrap-fanwaave-governance.yml
          test ! -e .github/workflows/publish-fanwaave-encrypted.yml
          test ! -e scripts/ops/copy_to_fanwaave.sh
          test ! -e scripts/ops/bootstrap_fanwaave_org.sh
          test ! -e scripts/ops/publish_fanwaave_encrypted.sh

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
