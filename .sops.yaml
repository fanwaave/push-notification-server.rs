# Public SOPS recipient policy for fanwaave/push-notification-server.rs.
# Private age identities and decrypted values must never enter Git, CI logs,
# caches, build layers, artifacts, or pull-request output.
#
# These are ordinary OR recipient sets, not a threshold policy. Keep them as
# plain `age:` lists so ores-sops-access-audit can verify desired-vs-actual
# recipient metadata and dev/prod separation.
creation_rules:
  - path_regex: ^env/enc/dev\.env\.enc$
    age:
      # Daily development/operator identity.
      - age1qrnva7lnv2jzww6ah5au0cqm4wkvkm5shpzflekdcm4nlu6wnyfqgfaxft
      # Independently stored recovery identity.
      - age1txv6jzlds2s03advmdtnm5l93qh4rkqs50nwvzk9yfvsartzue8se8t7jv

  - path_regex: ^env/enc/prod\.env\.enc$
    age:
      # Distinct protected-operator recipient.
      - age1s8lcnaxn9g77s6j4g7p24w6sgvllpue0lzrsvp3xk02k2gwjj5ssnkp39q
      # Independently stored recovery identity.
      - age1txv6jzlds2s03advmdtnm5l93qh4rkqs50nwvzk9yfvsartzue8se8t7jv
