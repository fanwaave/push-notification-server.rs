[graph]
targets = []
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every Git source is pinned to one reviewed immutable commit. No branch, tag,
# or wildcard Git source is accepted.
allow-git = [
  "https://github.com/flags-2-env/flags-2-env.git?rev=333c2ace93c362d274171ab0e0edf613d96a8e59",
  "https://github.com/juhaku/utoipa?rev=aecd7f75c8a8fa586e5d821cbabdb63fa27ad30a",
]
